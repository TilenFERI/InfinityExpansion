name: Java CI

on:
  push:
    branches:
      - master
      - slimefun5-port
  pull_request:
    branches:
      - master
      - slimefun5-port

jobs:
  build:
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Slimefun 5
        run: |
          curl -L https://github.com/Slimefun5/Slimefun5/releases/download/v5.3.3/Slimefun-5.3.3.jar -o Slimefun-5.3.3.jar
          mvn install:install-file -Dfile=Slimefun-5.3.3.jar -DgroupId=local.slimefun -DartifactId=Slimefun5 -Dversion=5.3.3 -Dpackaging=jar
      - name: Install InfinityLib
        run: |
          curl -L https://github.com/Slimefun5/InfinityLib/releases/download/v1.3.13/InfinityLib.jar -o InfinityLib.jar
          mvn install:install-file -Dfile=InfinityLib.jar -DgroupId=local.slimefun -DartifactId=InfinityLib -Dversion=1.3.13 -Dpackaging=jar
      - name: Build with Maven
        run: mvn clean package --file pom.xml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfinityExpansion
          path: target/*.jar
